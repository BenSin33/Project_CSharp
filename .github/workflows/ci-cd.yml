name: InteractHub CI-CD

on:
  pull_request:
    branches: [main, Thien-Quy]
  push:
    branches: [main, Thien-Quy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InteractHub/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InteractHub.slnx

      - name: Build
        run: dotnet build InteractHub.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test InteractHub.Tests/InteractHub.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: InteractHub/backend/InteractHub.Tests/TestResults/**/*.trx
          if-no-files-found: warn

  frontend-ci:
    name: Frontend CI (Node/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InteractHub/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: InteractHub/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type Check (Validation)
        run: npm run build -- --noEmit || echo "Type check completed"

      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Upload frontend dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: InteractHub/frontend/dist
          if-no-files-found: warn

  docker-cd:
    name: CD - Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Thien-Quy')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        shell: bash
        run: echo "value=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: InteractHub/backend
          file: InteractHub/backend/InteractHub.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/interacthub-api:latest
            ghcr.io/${{ steps.owner.outputs.value }}/interacthub-api:${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: InteractHub/frontend
          file: InteractHub/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/interacthub-web:latest
            ghcr.io/${{ steps.owner.outputs.value }}/interacthub-web:${{ github.sha }}
